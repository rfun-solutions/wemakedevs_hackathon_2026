# On every push to main: build the image, push it to GHCR, and point
# deploy/kustomization.yaml at it. Argo CD sees that commit and deploys it.
# The deploy: commit is pushed as the kubecompanion-deploy-bot GitHub App, which
# is a bypass actor on the main-protection ruleset (the default token is not).
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    # Only in your copy: the template repo itself keeps its placeholders.
    # Skip the bot's own deploy: commits (belt and braces with [skip ci]).
    if: >-
      github.repository != 'skyhook-io/cnh-starter' &&
      !startsWith(github.event.head_commit.message, 'deploy:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Mint deploy-bot token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}

      - name: Point the manifests at the new image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "kubecompanion-deploy-bot[bot]"
          git config user.email "5685272+kubecompanion-deploy-bot[bot]@users.noreply.github.com"
          # Push as the App: its token is a ruleset bypass actor, so it can push to main.
          git remote set-url origin "https://x-access-token:${GH_APP_TOKEN}@github.com/${REPO}.git"
          # Set the image on top of the latest main, not on the commit this run
          # built. A push that landed during the build (a merge, or the previous
          # run's deploy commit) then can't conflict; pull --rebase and retry if
          # one lands mid-push. Only the newTag line is rewritten.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            yq -i '(.images[] | select(.name == "app")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' deploy/kustomization.yaml
            if git diff --quiet; then exit 0; fi
            git commit -qam "deploy: ${TAG} [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            git pull -q --rebase origin main || git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Couldn't push the deploy commit after 5 tries." >&2
          exit 1
