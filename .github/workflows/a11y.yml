name: a11y
permissions:
  contents: read
on:
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Axe on the shell page
        run: npx playwright test --project=iphone-15 --grep "axe clean"
        env:
          CI: "true"
          PORT: "3100"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
