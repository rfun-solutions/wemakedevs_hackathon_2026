name: feed-contract
permissions:
  contents: read
on:
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  feed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIXTURE: ${{ vars.FEED_FIXTURE || 'sessionize-v1' }}
      MODE: ${{ vars.FEED_MODE || 'ok' }}
      PORT: '4010'
      FEED_URL: http://127.0.0.1:4010/feed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start mock upstream
        run: |
          node feed-contract/mock-upstream/server.mjs > mock-upstream.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fs http://127.0.0.1:4010/healthz > /dev/null && exit 0
            sleep 0.5
          done
          cat mock-upstream.log
          exit 1
      - name: Validate feed against schema
        run: |
          echo "fixture=$FIXTURE mode=$MODE"
          node feed-contract/scripts/validate-feed.mjs "$FEED_URL"
      - name: Mapper and fetch tests
        run: npx vitest run --project api api/src/services/sessionize
      - name: Fixture and mock upstream tests
        run: npx vitest run --config feed-contract/vitest.config.mjs
      - name: Deploy bump changes exactly one line
        run: scripts/test-set-image-tag.sh
