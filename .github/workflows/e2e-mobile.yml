name: e2e-mobile
permissions:
  contents: read
on:
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-mobile:
    runs-on: ubuntu-latest
    # Browsers and system deps are preinstalled; the version matches @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright (iPhone 15, Pixel 7)
        run: npx playwright test --project=iphone-15 --project=pixel-7 --grep-invert "axe clean"
        env:
          CI: "true"
          PORT: "3100"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-mobile-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
