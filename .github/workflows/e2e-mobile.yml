name: e2e-mobile
permissions:
  contents: read
on:
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright (iPhone 15, Pixel 7, kay)
        run: npx playwright test --project=iphone-15 --project=pixel-7 --project=kay --grep-invert "axe clean" --pass-with-no-tests
        env:
          CI: "true"
          PORT: "3100"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-mobile-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
