name: observability
permissions:
  contents: read
on:
  pull_request:
    paths:
      - observability/**
      - .github/workflows/observability.yml
  push:
    branches: [main]
    paths:
      - observability/**
      - .github/workflows/observability.yml
  workflow_dispatch:

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

env:
  DASH0_API_URL: https://api.us-west-2.aws.dash0.com
  PERSES_VERSION: v0.51.0
  DASH0_CLI_VERSION: v1.5.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install percli
        run: |
          curl -fsSL -o percli.tar.gz "https://github.com/perses/perses/releases/download/${PERSES_VERSION}/perses_${PERSES_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf percli.tar.gz percli
          sudo install percli /usr/local/bin/percli

      - name: Lint dashboards (percli)
        run: |
          shopt -s nullglob
          for f in observability/*.perses.yaml; do
            echo "percli lint $f"
            percli lint -f "$f" --online=false
          done

      - name: YAML parses
        run: |
          for f in observability/*.yaml; do
            python3 -c 'import sys,yaml; list(yaml.safe_load_all(open(sys.argv[1])))' "$f"
          done

  apply:
    # Only after merge to main. Needs the repo secret DASH0_TOKEN (set by the user, never in the repo).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dash0 CLI
        run: |
          # UNVERIFIED flags/asset name: confirm with `dash0 --help` (tasks.md 3.4).
          curl -fsSL -o dash0.tar.gz "https://github.com/dash0hq/dash0-cli/releases/download/${DASH0_CLI_VERSION}/dash0_linux_amd64.tar.gz"
          tar -xzf dash0.tar.gz dash0
          sudo install dash0 /usr/local/bin/dash0
          dash0 --help | head -20

      - name: Apply observability objects
        env:
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_TOKEN }}
        run: |
          if [ -z "$DASH0_AUTH_TOKEN" ]; then echo "DASH0_TOKEN not set; skipping apply"; exit 0; fi
          for f in observability/*.yaml; do
            echo "dash0 apply $f"
            dash0 --api-url "$DASH0_API_URL" --auth-token "$DASH0_AUTH_TOKEN" apply -f "$f"
          done
