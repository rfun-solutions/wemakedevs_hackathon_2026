# CloudNativePG Cluster "db" (operator is pre-installed in the cluster). Service db-rw,
# credentials in Secret db-app (keys username, password, uri). Based on examples/postgres/cluster.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
spec:
  instances: 1
  storage:
    size: 2Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 500m, memory: 768Mi }
