# c-evening-threads: nightly threading for every device with notes that day.
# Suspended by default so the demo is deterministic; `kubectl create job --from=cronjob/threads-nightly manual-run`
# triggers it. THREADS_CRON_TOKEN comes from a Secret created out of band (never in git).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: threads-nightly
  labels:
    app: threads-nightly
spec:
  schedule: "0 2 * * *"
  timeZone: America/Denver
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: threads-nightly
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: app
              command:
                - node
                - -e
                - |
                  fetch('http://app/api/threads/run', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json', 'x-cron-token': process.env.THREADS_CRON_TOKEN },
                    body: JSON.stringify({ allDevices: true }),
                    signal: AbortSignal.timeout(100000),
                  }).then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1); },
                           (e) => { console.error(e.message); process.exit(1); });
              env:
                - name: THREADS_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: threads-cron
                      key: THREADS_CRON_TOKEN
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: ["ALL"]
