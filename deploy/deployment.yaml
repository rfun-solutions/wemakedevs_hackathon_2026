apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "kubecompanion2026"
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            # kc-secrets is created by hand, never in git (see AGENTS.md). optional so the
            # pod starts (LLM and telemetry degrade gracefully) before the Secret exists.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kc-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: DASH0_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kc-secrets
                  key: DASH0_TOKEN
                  optional: true
            # >> b-capture
            - name: KC_DEMO_SEED
              value: "0"
            # >> f-observability-product
            - name: CHAOS_FILE
              value: /etc/kc-chaos/flags.json
            # Kubernetes resource attributes for Dash0 (downward API); OTEL_RESOURCE_ATTRIBUTES must come after the vars it uses.
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME),k8s.deployment.name=app
            # >> c-evening-threads
            - name: THREADS_MODEL
              value: "claude-haiku-5-5"
            - name: THREADS_DAILY_CAP_USD
              value: "0.05"
            # Optional key of kc-secrets (AGENTS.md Secrets); the cron path stays 401 until it is set.
            - name: THREADS_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kc-secrets
                  key: THREADS_CRON_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            # >> f-observability-product
            - name: kc-chaos
              mountPath: /etc/kc-chaos
              readOnly: true
            # >> f-observability-product-health
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      # Pod-level volumes (each entry goes under its own marker).
      volumes:
        # >> f-observability-product
        - name: kc-chaos
          configMap:
            name: kc-chaos
            optional: true
        # >> f-observability-product-health
